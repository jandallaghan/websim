name: CI
on: [push, pull_request]
jobs:
  workflows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install packet capture tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          sudo chmod 755 /usr/bin/dumpcap
          sudo setcap cap_net_raw,cap_net_admin=eip /usr/bin/dumpcap
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run check
      - run: npm run build
      - run: docker build -f docker/Dockerfile -t websim-sandbox:local .
      - run: npm test
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces-node-${{ matrix.node }}
          path: test-results/
